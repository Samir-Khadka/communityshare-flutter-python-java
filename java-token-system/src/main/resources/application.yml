server:
  port: 8080

spring:
  application:
    name: toolshare-token-system
  datasource:
    url: jdbc:h2:file:./tokensdb;DB_CLOSE_DELAY=-1
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.toolshare.tokens: DEBUG
    org.springframework.web: INFO
