name: tool_sharing_app
description: A new Flutter project for sharing household tools.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  
  # State Management
  provider: ^6.0.5
  
  # Firebase Core & Auth
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.2
  uuid: ^4.0.0
  
  # Utilities
  intl: any
  image_picker: ^1.0.4
  firebase_storage: ^12.3.2
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  
  # UI/UX
  cupertino_icons: ^1.0.2
  
  # HTTP Client
  http: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
